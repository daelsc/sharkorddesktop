<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sharkov Codec Self-Test</title>
<style>
  html,body{margin:0;background:#0a0a0a;color:#e4e4e7;font:13px/1.4 ui-monospace,Consolas,monospace}
  #log{white-space:pre-wrap;padding:8px;max-height:60vh;overflow:auto}
  video{display:none}
  canvas{display:none}
  b{color:#a1e6a1}
</style>
</head>
<body>
<div id="log"></div>
<canvas id="c" width="1280" height="720"></canvas>
<video id="v" autoplay muted playsinline></video>
<script>
  // Branch on ?mode=live to load the real-server mediasoup harness; otherwise
  // run the local loopback codec self-test.
  var s = document.createElement('script');
  s.src = new URLSearchParams(location.search).get('mode') === 'live'
    ? 'selftest-live.js' : 'selftest.js';
  document.body.appendChild(s);
</script>
</body>
</html>
